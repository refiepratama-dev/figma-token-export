<style>
  body { margin: 0; padding: 16px; font: 12px/1.4 system-ui, sans-serif; color: #1c1917; }
  h1 { font-size: 14px; font-weight: 600; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: #78716c; }
  textarea {
    width: 100%; height: 360px; box-sizing: border-box; padding: 8px;
    border: 1px solid #d6d3d1; border-radius: 6px; background: #fafaf9;
    font: 11px/1.4 ui-monospace, Consolas, monospace; resize: none;
  }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  button {
    height: 32px; padding: 0 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid #e7e5e4; background: #fff; font: inherit;
  }
  button.primary { background: #6e4ef2; border-color: #6e4ef2; color: #fff; }
</style>

<h1>Token Export</h1>
<p>Simpan sebagai <code>tokens/figma-variables.json</code> di repo, lalu jalankan <code>npx figma-token-export</code>.</p>
<textarea id="out" readonly>Membaca variables…</textarea>
<div class="row">
  <button class="primary" id="download">Download JSON</button>
  <button id="copy">Copy</button>
  <button id="close" style="margin-left:auto">Tutup</button>
</div>

<script>
  const out = document.getElementById("out");

  onmessage = (e) => {
    const msg = e.data.pluginMessage;
    if (msg.type === "tokens") out.value = msg.json;
    if (msg.type === "error") out.value = "Error: " + msg.message;
  };

  document.getElementById("download").onclick = () => {
    const blob = new Blob([out.value], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "figma-variables.json";
    a.click();
  };

  document.getElementById("copy").onclick = () => {
    out.select();
    document.execCommand("copy");
    parent.postMessage({ pluginMessage: { type: "notify", text: "JSON disalin ✓" } }, "*");
  };

  document.getElementById("close").onclick = () =>
    parent.postMessage({ pluginMessage: { type: "close" } }, "*");
</script>
